  <!-- SPA na Vercel: um caminho direto (ex.: /redefinir-senha, vindo do e-mail do Supabase) é servido
       por este index.html. Volta a URL para "/" ANTES de carregar os recursos relativos, preservando
       query e fragmento (o callback de recuperação os consome e limpa em seguida). -->
  <script>
    (function () {
      var p = location.pathname;
      if (p !== "/" && p !== "/index.html" && !/\.[a-z0-9]+$/i.test(p)) {
        // /redefinir-senha (sem fragmento) vira a rota #/redefinir-senha da SPA.
        var hash = location.hash || (/^\/redefinir-senha\/?$/.test(p) ? "#/redefinir-senha" : "");
        try { history.replaceState(null, "", "/" + location.search + hash); } catch (e) { /* segue */ }
      }
    })();
  </script>
  <!-- Preferências de tema e acessibilidade ANTES do CSS: evita a tela "piscar" no visual padrão.
       A cópia vem de features/preferencias.js; a fonte da verdade é a conta (GET /auth/me). -->
  <script>
    (function () {
      var d = document.documentElement, p = {}, t = null;
      try { p = JSON.parse(localStorage.getItem("decos_intranet_prefs") || "{}") || {}; } catch (e) { p = {}; }
      try { t = (JSON.parse(localStorage.getItem("decos_intranet_state") || "{}") || {}).theme; } catch (e) { t = null; }
      if (p.texto && p.texto !== 100) d.dataset.texto = String(p.texto);
      if (p.escala && p.escala !== "normal") d.dataset.escala = p.escala;
      if (p.espacamento === "amplo") d.dataset.espacamento = "amplo";
      // Alto contraste: a escolha da conta vale; sem escolha, segue o sistema (prefers-contrast).
      if (p.alto_contraste === true || (p.alto_contraste === undefined && window.matchMedia && matchMedia("(prefers-contrast: more)").matches)) d.dataset.contraste = "alto";
      if (p.reduzir_movimento) d.dataset.movimento = "reduzido";
      if (p.reduzir_transparencia) d.dataset.transparencia = "reduzida";
      if (p.sublinhar_links) d.dataset.links = "sublinhado";
      if (p.foco_reforcado) d.dataset.foco = "reforcado";
      if (p.fonte_leitura) d.dataset.fonte = "leitura";
      var tema = p.tema || t;
      if (tema === "auto") tema = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      if (tema === "dark") d.classList.add("dark");
      if (tema === "red") d.classList.add("theme-red");
    })();
  </script>
