<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intranet Corporativa · Hospital Decós</title>
  <meta name="description" content="Intranet corporativa do Hospital Decós — avisos, eventos, documentos, POPs, ramais e painel administrativo.">

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            wine: { DEFAULT:'#8E1B2E', 50:'#FCE9ED', 100:'#F7D6DD', 600:'#8E1B2E', 700:'#6E0F22', 800:'#5A0C1C' },
            crimson: { DEFAULT:'#F5334D', 500:'#F5334D' },
          },
          fontFamily: { sans:['Public Sans','system-ui','sans-serif'] },
        },
      },
    };
  </script>

  <!-- Fonte: Public Sans — desenhada para clareza institucional (USWDS), escolha
       deliberada para um sistema corporativo hospitalar: mais confiança e menos
       "padrão SaaS" que a Inter genérica. Peso 500 cobre o texto médio (em vez de
       recorrer sempre a 700), 800 fica reservado para os poucos momentos de destaque. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- Estilos: base → layout → componentes → telas -->
  <link rel="stylesheet" href="src/styles/base/tokens-e-temas.css">
  <link rel="stylesheet" href="src/styles/base/tipografia.css">
  <link rel="stylesheet" href="src/styles/base/acessibilidade.css">
  <link rel="stylesheet" href="src/styles/layout/layout.css">
  <link rel="stylesheet" href="src/styles/layout/sidebar.css">
  <link rel="stylesheet" href="src/styles/layout/topbar.css">
  <link rel="stylesheet" href="src/styles/layout/quick-fab.css">
  <link rel="stylesheet" href="src/styles/components/avatar.css">
  <link rel="stylesheet" href="src/styles/components/card.css">
  <link rel="stylesheet" href="src/styles/components/badges-e-pills.css">
  <link rel="stylesheet" href="src/styles/components/botoes.css">
  <link rel="stylesheet" href="src/styles/components/chips-e-paginacao.css">
  <link rel="stylesheet" href="src/styles/components/hero.css">
  <link rel="stylesheet" href="src/styles/components/data-chip.css">
  <link rel="stylesheet" href="src/styles/components/prose-e-progresso.css">
  <link rel="stylesheet" href="src/styles/components/fotos.css">

  <link rel="stylesheet" href="src/styles/components/painel.css">
  <link rel="stylesheet" href="src/styles/components/modal.css">

  <link rel="stylesheet" href="src/styles/components/confete.css">
  <link rel="stylesheet" href="src/styles/pages/dashboard.css">

  <link rel="stylesheet" href="src/styles/pages/faq.css">
  <link rel="stylesheet" href="src/styles/pages/login.css">
  <link rel="stylesheet" href="src/styles/pages/admin.css">
</head>
<body>
  <div id="app"></div>
